<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <title>Coco Excel Package Probe</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17202a;
        background: #f7f8fa;
      }
      button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 8px 10px;
        border: 1px solid #ccd3dd;

      button.primary {
        background: #1769e0;

        color: #fff;

        border: 1px solid #d8dee8;

    <script type="module" crossorigin src="../../assets/excel-probe-voCngHkT.js"></script>

  <body>
    <h3>Excel Package Probe</h3>
    <button id="probe" class="primary">写未保存标记并导出 xlsx</button>
    <button id="deep-probe">深度写入对象并导出 xlsx</button>
    <button id="advanced-probe">扩展结构探针</button>
    <button id="perf-probe">性能边界探针</button>
    <button id="writeback-probe">Excel 写回能力探针</button>

    <button id="paste-api-probe">Paste API 探针</button>
    <button id="api-enum-probe">穷举写回 API</button>
    <button id="internal-api-probe">内部 API 暗门探针</button>
    <button id="rewrite-probe">改写导出包并打开</button>
    <button id="create">用导出的 xlsx 打开新 workbook</button>
    <pre id="log"></pre>
  </body>
</html>
